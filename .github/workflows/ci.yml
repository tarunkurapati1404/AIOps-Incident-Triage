name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aiops-incident-triage .

      - name: Run tests inside the container
        run: docker run --name testrun aiops-incident-triage || true

      - name: Copy test report out of the container
        run: |
          docker cp testrun:/app/test-results.xml ./test-results.xml
          docker rm testrun

      - name: Upload test report (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml