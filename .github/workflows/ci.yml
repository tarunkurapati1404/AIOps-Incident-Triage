name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aiops-incident-triage .

      - name: Run tests inside the container
        run: docker run --name testrun aiops-incident-triage || true

      - name: Copy test report out of the container
        run: |
          docker cp testrun:/app/test-results.xml ./test-results.xml
          docker rm testrun

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  triage:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Run AI triage
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python triage/analyzer.py

      - name: Email triage report to on-call
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python triage/notify.py

      - name: Upload triage report
        uses: actions/upload-artifact@v4
        with:
          name: triage-report
          path: triage-report.md